<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GETy - Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- Configurações Gerais (Material 3 Tokens) --- */
        :root {
            /* Paleta Dark Flet / Google Material */
            --md-sys-color-background: #111111;
            --md-sys-color-surface: #1e1e1e;
            --md-sys-color-on-surface: #e3e3e3;
            --md-sys-color-on-surface-variant: #c4c7c5;
            
            /* Cores da Marca (Vermelho e Azul solicitados) */
            --md-sys-color-primary: #ff4d4d; /* Vermelho vibrante */
            --md-sys-color-secondary: #448aff; /* Azul vibrante */
            --md-sys-color-primary-container: #3f100f;
            --md-sys-color-on-primary: #ffffff;
            
            /* Espaçamento e Bordas */
            --md-sys-shape-corner-large: 28px;
            --md-sys-shape-corner-full: 9999px; /* Pill shape */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-surface);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(68, 138, 255, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(255, 77, 77, 0.08) 0%, transparent 40%);
        }

        /* --- Container Principal (Card Estilo MD3) --- */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        /* --- Header --- */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -0.05rem;
            /* Efeito Gradiente Vermelho -> Azul */
            background: linear-gradient(135deg, var(--md-sys-color-primary), var(--md-sys-color-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .badge {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--md-sys-color-on-surface-variant);
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
        }

        /* --- Main Content --- */
        main {
            background-color: var(--md-sys-color-surface);
            padding: 2.5rem;
            border-radius: var(--md-sys-shape-corner-large);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 1.3;
            color: var(--md-sys-color-on-surface);
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--md-sys-color-on-surface-variant);
        }

        /* --- Botão Moderno (Material 3) --- */
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            font-size: 1.1rem;
            font-weight: 500;
            padding: 16px 32px;
            border-radius: var(--md-sys-shape-corner-full);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
            box-shadow: 0 4px 12px rgba(255, 77, 77, 0.3);
            width: 100%;
        }

        .btn-download:hover {
            background-color: #ff6666; /* Ligeiramente mais claro */
            box-shadow: 0 6px 16px rgba(255, 77, 77, 0.5);
            transform: translateY(-2px);
        }

        .btn-download svg {
            fill: currentColor;
            width: 24px;
            height: 24px;
        }

        .small-text {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: -0.5rem;
        }

        /* --- Footer --- */
        footer {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #666;
        }

        /* --- Animação --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsividade para telas muito pequenas */
        @media (max-width: 480px) {
            h1 { font-size: 3rem; }
            main { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>GETy</h1>
            <span class="badge">Versão 1.5</span>
        </header>

        <main>
            <h2>Baixe vídeos de forma simples.</h2>
            <p>Rápido, leve e com suporte a filas de downloads. Desenvolvido com ❤  para você!</p>

            <a href="downloads/GETy_v1.5.exe" class="btn-download" download>
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 16L7 11L8.41 9.59L11 12.17V4H13V12.17L15.59 9.59L17 11L12 16ZM6 20V18H18V20H6Z"/>
                </svg>
                Baixar para Windows
            </a>
            
            <p class="small-text">Compatível com Windows 10 e 11</p>
        </main>

        <footer>
            <p>&copy; 2026 GETy Project. Todos os direitos reservados.</p>
        </footer>
    </div>

</body>
</html>
